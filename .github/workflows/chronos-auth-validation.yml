name: Chronos-V Google Auth Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/chronos-android-app-links-association]

permissions:
  contents: read

concurrency:
  group: chronos-google-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

  lint:
    name: Changed-file ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint files changed for this fix
        run: |
          bunx eslint \
            src/lib/google-auth-return.ts \
            src/lib/native-google-handoff.functions.ts \
            src/lib/native-google-handoff.server.ts \
            src/lib/outlook-connect.server.ts \
            src/lib/outlook.functions.ts \
            src/routes/auth.google-handoff.tsx \
            src/routes/auth.google-return.tsx \
            src/routes/auth.google-start.tsx \
            src/routes/auth.tsx \
            tests/google-auth-return.test.ts \
            tests/native-google-handoff.test.ts \
            tests/outlook-connect-integration.test.ts

  repository-lint:
    name: Repository-wide lint baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
